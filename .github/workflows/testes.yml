name: Testes automáticos

# Roda a cada envio e em cada Pull Request. Abre o app no Chromium (sem celular) e
# confere progresso, layout, abertura rápida, ponte com o Android, pasta web e notas.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências dos testes
        working-directory: tests
        run: npm ci

      - name: Instalar o Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        working-directory: tests
        run: node run-all.js
