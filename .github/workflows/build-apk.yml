name: Gerar APK (debug)

# Roda a cada envio para a branch de otimização e também sob demanda
# (aba Actions > Gerar APK (debug) > Run workflow).
on:
  push:
    branches: [claude/otimizacao-android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Componentes do Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # Opcional: se o segredo DEBUG_KEYSTORE_BASE64 existir, o APK é assinado com a
      # MESMA chave do seu PC e instala por cima do app atual, sem apagar os dados.
      - name: Chave de debug (opcional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Usando a chave de debug fornecida."
          else
            echo "Sem chave fornecida: o APK usa uma chave nova (não instala por cima do app já instalado)."
          fi

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlay-2.1.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
